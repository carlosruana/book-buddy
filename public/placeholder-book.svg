<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="600" viewBox="0 0 400 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="600" fill="#F8FAFC"/>
  
  <!-- Book spine shadow -->
  <rect x="40" y="40" width="320" height="520" fill="#E2E8F0" rx="8"/>
  
  <!-- Book cover -->
  <rect x="30" y="30" width="320" height="520" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2" rx="8"/>
  
  <!-- Book icon -->
  <path d="M140 220 H260 M140 260 H220" stroke="#94A3B8" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="180" r="40" stroke="#94A3B8" stroke-width="8" fill="none"/>
  
  <!-- Text -->
  <text x="200" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#64748B" text-anchor="middle">
    Cover Not Available
  </text>
  <text x="200" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#94A3B8" text-anchor="middle">
    BookBuddy
  </text>
</svg> 